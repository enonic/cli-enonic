name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency: release

permissions:
  id-token: write
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      ARTIFACTORY_REPO_USERNAME: ci
      ARTIFACTORY_REPO_SECRET: ${{ secrets.ARTIFACTORY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # vX.Y.Z is a final release; anything else (v4.2.0-B1, v4.2.0-RC1) is a prerelease
      - name: Detect prerelease
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
            echo "### Final release $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Latest, npm \`latest\`, Snap \`stable\`, Homebrew, Scoop" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
            echo "### Prerelease $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub prerelease, npm \`beta\`, Snap \`beta\`. Homebrew and Scoop are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0

      - name: Test
        run: go test -v ./...

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3

      - name: GoReleaser Action
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TOKEN: ${{ secrets.CLI_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # npm stages a CI publish until a maintainer approves it on npmjs.com;
      # rerunning this step after that fails with 409 Conflict
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm ci
          # set the version before npm publish, which reads package.json before prepublishOnly runs
          node setversion.js
          npm publish --tag ${{ steps.version.outputs.npm-tag }}
