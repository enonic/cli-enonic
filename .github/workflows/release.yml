name: Release

on:
  push:
    tags:
      - 'v*'
  # publishes a released tag to npm only, e.g. when the release's own npm publish failed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to publish to npm, e.g. v4.2.0-B1'
        required: true

concurrency: release

permissions:
  id-token: write
  contents: write

jobs:

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      ARTIFACTORY_REPO_USERNAME: ci
      ARTIFACTORY_REPO_SECRET: ${{ secrets.ARTIFACTORY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0

      - name: Test
        run: go test -v ./...

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3

      - name: GoReleaser Action
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TOKEN: ${{ secrets.CLI_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set npm tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "NPM_TAG=latest" >> $GITHUB_ENV
          else
            echo "NPM_TAG=beta" >> $GITHUB_ENV
          fi

      - name: Publish
        run: |
          npm install -g npm@latest
          npm ci
          # set the version before npm publish, which reads package.json before prepublishOnly runs
          node setversion.js
          npm publish --tag $NPM_TAG

  npm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # setversion.js takes the version from the tag
      GITHUB_REF_NAME: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0

      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set npm tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "NPM_TAG=latest" >> $GITHUB_ENV
          else
            echo "NPM_TAG=beta" >> $GITHUB_ENV
          fi

      - name: Publish
        run: |
          npm install -g npm@latest
          npm ci
          node setversion.js
          npm publish --tag $NPM_TAG
